<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gauss-Seidel Method Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <h1>Gauss-Seidel Solver</h1>
    <p>Iterative Linear Equation System Solver</p>
  </header>

  <div class="card">
    <div class="controls-grid">
      <div class="input-group">
        <label for="matrix-size">Dimensions (N × N)</label>
        <input type="number" id="matrix-size" value="3" min="2" max="6" onchange="buildMatrixInputs()">
      </div>
      <div class="input-group">
        <label for="max-iterations">Max Iterations</label>
        <input type="number" id="max-iterations" value="50" min="1">
      </div>
      <div class="input-group">
        <label for="tolerance">Tolerance (ε)</label>
        <input type="number" id="tolerance" value="0.0001" step="0.0001" min="0">
      </div>
    </div>

    <div class="matrix-wrapper">
      <label>System of Equations [A][X] = [B] & Initial Guess</label>
      <div id="matrix-container" class="matrix-grid"></div>
    </div>

    <button class="btn" style="margin-top: 1.5rem;" onclick="solveGaussSeidel()">Calculate Solution</button>
  </div>

  <div id="error-display" class="error-box"></div>

  <div id="results-card" class="card results-card">
    <h2 style="font-size: 1.2rem; color: var(--text);">Final Converged Solution</h2>
    <div id="solution-output" class="solution-grid"></div>

    <details>
      <summary>View Detailed Iteration Console Log</summary>
      <div id="console-output" class="console-log"></div>
    </details>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
