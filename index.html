<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3×3 Gauss-Seidel Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>3×3 Gauss-Seidel Calculator</h1>

    <div class="card">

        <h2>Matrix A</h2>

        <div class="matrix">
            <input id="a11" type="number">
            <input id="a12" type="number">
            <input id="a13" type="number">

            <input id="a21" type="number">
            <input id="a22" type="number">
            <input id="a23" type="number">

            <input id="a31" type="number">
            <input id="a32" type="number">
            <input id="a33" type="number">
        </div>

        <h2>Vector B</h2>

        <div class="vector">
            <input id="b1" type="number">
            <input id="b2" type="number">
            <input id="b3" type="number">
        </div>

        <h2>Initial Guess X₀</h2>

        <div class="vector">
            <input id="x1" type="number" value="0">
            <input id="x2" type="number" value="0">
            <input id="x3" type="number" value="0">
        </div>

        <div class="settings">

            <div>
                <label>Tolerance</label>
                <input id="tol" type="number" value="0.0001" step="0.0001">
            </div>

            <div>
                <label>Max Iterations</label>
                <input id="maxIter" type="number" value="50">
            </div>

        </div>

        <button onclick="solveGaussSeidel()">
            Calculate
        </button>

    </div>

    <div class="card">

        <h2>Calculation Console</h2>

        <div id="consoleArea" class="console"></div>

    </div>

    <div class="card">

        <button class="collapseBtn" onclick="toggleIterations()">
            Show / Hide Iterations
        </button>

        <div id="iterationsArea" class="iterations"></div>

    </div>

    <div class="card result">

        <h2>Final Solution</h2>

        <div id="solution">
            Waiting for calculation...
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
